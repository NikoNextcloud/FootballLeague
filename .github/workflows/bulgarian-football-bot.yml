name: Football data and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Offset from the busy top of the hour. GitHub schedules can be delayed.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: football-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parser and preservation regressions
        run: python -m unittest discover -s tests -v
      - name: Validate saved data
        run: python scripts/bulgarian_football_bot.py --validate-only
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js
          node --check football-data.js
          node --test tests/*.mjs
      - name: Fetch and validate source data
        if: github.event_name != 'pull_request'
        run: python scripts/bulgarian_football_bot.py
      - name: Save validated snapshot
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bulgarian-football.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh validated football snapshot"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - name: Stage public files only
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp index.html styles.css app.js football-data.js service-worker.js manifest.webmanifest _site/
          cp -R assets data _site/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  browser:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser QA tools
        run: npm install --prefix "$RUNNER_TEMP/football-qa" --no-audit --no-fund playwright@1.62.1 @axe-core/playwright@4.14.0
      - name: Install Chromium
        run: node "$RUNNER_TEMP/football-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser flows and accessibility
        env:
          CHECK_ACCESSIBILITY: "1"
        run: NODE_PATH="$RUNNER_TEMP/football-qa/node_modules" node tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-browser-screenshots
          path: /tmp/football-*.png
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: always() && github.event_name != 'pull_request' && needs.build.result == 'success' && (needs.browser.result == 'success' || needs.browser.result == 'skipped')
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Explicit deployment also publishes scheduled GITHUB_TOKEN data commits;
      # such commits do not trigger another workflow or branch Pages build.
      - name: Deploy validated application
        id: deployment
        uses: actions/deploy-pages@v4
